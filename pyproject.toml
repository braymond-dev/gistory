[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gistory"
version = "0.1.0"
description = "Generate a narrative Markdown history from a local Git repository."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Benjamin Raymond" }
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "PyYAML>=6.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
gistory = "gistory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["gistory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
